# Gate minimo (fragmento ci-minimo). Copie para .github/workflows/ ao ativar CI.
name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "10.0.x"}
      - run: dotnet restore
      - run: ./check.sh
