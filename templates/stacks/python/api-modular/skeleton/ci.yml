# Gate minimo (fragmento ci-minimo). Copie para .github/workflows/ ao ativar CI.
name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: make install
      - run: make check
