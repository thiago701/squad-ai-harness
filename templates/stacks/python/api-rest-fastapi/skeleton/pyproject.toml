[project]
name = "{{project_name}}"
version = "0.1.0"
description = "API REST FastAPI gerada pelo MITR (Squad AI)"
requires-python = ">=3.10"
dependencies = ["fastapi==0.139.0", "pydantic==2.11.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
files = ["src"]
strict = true

[tool.coverage.run]
source = ["src"]
