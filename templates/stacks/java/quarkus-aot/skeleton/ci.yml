# Gate minimo (fragmento ci-minimo). Copie para .github/workflows/ ao ativar CI.
name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: graalvm
          java-version: "25"}
      - run: mvn -B -q dependency:go-offline
      - run: mvn -B verify
